services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windfor_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windfor_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
